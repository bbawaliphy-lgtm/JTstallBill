<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juice Therapy Billing</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Manifest (inline as data URI) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Juice Therapy Billing","short_name":"Billing","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#f97316","icons":[]}'>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- App code (JSX). Babel will transpile this in the browser. -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    // Simple lightweight icon component using emoji as placeholders,
    // mapped to the icon names used in the original TSX. This keeps the UI identical in layout.
    const Icon = ({ name, size = 18 }) => {
      const map = {
        Plus: "➕",
        Edit2: "✏️",
        Trash2: "🗑️",
        ShoppingCart: "🛒",
        FileText: "📄",
        BarChart3: "📊",
        Package: "📦",
        ChevronDown: "▾",
        ChevronUp: "▴"
      };
      const emoji = map[name] || "•";
      return (
        <span
          aria-hidden="true"
          style={{
            display: "inline-block",
            width: size + "px",
            height: size + "px",
            lineHeight: size + "px",
            textAlign: "center",
            fontSize: Math.round(size * 0.9) + "px"
          }}
        >
          {emoji}
        </span>
      );
    };

    function JuiceTherapyBilling() {
      const [activeTab, setActiveTab] = useState('new-sale');
      const [items, setItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [currentOrder, setCurrentOrder] = useState([]);
      const [showItemForm, setShowItemForm] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [itemForm, setItemForm] = useState({ name: '', price: '' });
      const [showAllOrders, setShowAllOrders] = useState(false);
      const [summaryFilter, setSummaryFilter] = useState('today');
      const [customDateRange, setCustomDateRange] = useState({ start: '', end: '' });

      useEffect(() => {
        const savedItems = JSON.parse(localStorage.getItem('items') || '[]');
        const savedOrders = JSON.parse(localStorage.getItem('orders') || '[]');
        setItems(savedItems);
        setOrders(savedOrders);
      }, []);

      useEffect(() => {
        localStorage.setItem('items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('orders', JSON.stringify(orders));
      }, [orders]);

      const getTodayOrderNumber = () => {
        const today = new Date().toDateString();
        const todayOrders = orders.filter(o => new Date(o.date).toDateString() === today);
        return todayOrders.length + 1;
      };

      const addItem = () => {
        if (!itemForm.name || !itemForm.price) return;
        if (editingItem) {
          setItems(items.map(item =>
            item.id === editingItem.id
              ? { ...item, name: itemForm.name, price: parseFloat(itemForm.price) }
              : item
          ));
          setEditingItem(null);
        } else {
          setItems([...items, {
            id: Date.now(),
            name: itemForm.name,
            price: parseFloat(itemForm.price)
          }]);
        }
        setItemForm({ name: '', price: '' });
        setShowItemForm(false);
      };

      const deleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const editItem = (item) => {
        setEditingItem(item);
        setItemForm({ name: item.name, price: item.price });
        setShowItemForm(true);
      };

      const addToCurrentOrder = (itemId) => {
        const item = items.find(i => i.id === itemId);
        if (!item) return;
        const existing = currentOrder.find(o => o.itemId === itemId);
        if (existing) {
          setCurrentOrder(currentOrder.map(o =>
            o.itemId === itemId ? { ...o, quantity: o.quantity + 1 } : o
          ));
        } else {
          setCurrentOrder([...currentOrder, {
            itemId,
            name: item.name,
            price: item.price,
            quantity: 1
          }]);
        }
      };

      const updateOrderQuantity = (itemId, quantity) => {
        const q = parseInt(quantity, 10);
        if (isNaN(q) || q <= 0) {
          setCurrentOrder(currentOrder.filter(o => o.itemId !== itemId));
        } else {
          setCurrentOrder(currentOrder.map(o =>
            o.itemId === itemId ? { ...o, quantity: q } : o
          ));
        }
      };

      const calculateTotal = (orderItems) => {
        return orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      };

      const saveOrder = (paid = false, served = false) => {
        if (currentOrder.length === 0) return;
        const newOrder = {
          id: Date.now(),
          orderNumber: getTodayOrderNumber(),
          date: new Date().toISOString(),
          items: currentOrder,
          total: calculateTotal(currentOrder),
          paid,
          served
        };
        setOrders([newOrder, ...orders]);
        setCurrentOrder([]);
      };

      const deleteOrder = (id) => {
        setOrders(orders.filter(o => o.id !== id));
      };

      const toggleOrderStatus = (id, field) => {
        setOrders(orders.map(o =>
          o.id === id ? { ...o, [field]: !o[field] } : o
        ));
      };

      const getFilteredOrders = () => {
        const now = new Date();
        const today = new Date(now.setHours(0, 0, 0, 0));

        switch (summaryFilter) {
          case 'today':
            return orders.filter(o => new Date(o.date) >= today);
          case 'yesterday': {
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            return orders.filter(o => {
              const orderDate = new Date(o.date);
              return orderDate >= yesterday && orderDate < today;
            });
          }
          case 'last3days': {
            const threeDaysAgo = new Date(today);
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
            return orders.filter(o => new Date(o.date) >= threeDaysAgo);
          }
          case 'custom':
            if (!customDateRange.start || !customDateRange.end) return orders;
            const start = new Date(customDateRange.start);
            const end = new Date(customDateRange.end);
            end.setHours(23, 59, 59, 999);
            return orders.filter(o => {
              const orderDate = new Date(o.date);
              return orderDate >= start && orderDate <= end;
            });
          default:
            return orders;
        }
      };

      const getSummaryData = () => {
        const filtered = getFilteredOrders();
        const itemSales = {};
        let totalRevenue = 0;

        filtered.forEach(order => {
          totalRevenue += order.total;
          order.items.forEach(item => {
            if (!itemSales[item.name]) {
              itemSales[item.name] = { quantity: 0, revenue: 0 };
            }
            itemSales[item.name].quantity += item.quantity;
            itemSales[item.name].revenue += item.price * item.quantity;
          });
        });

        return { itemSales, totalRevenue, orderCount: filtered.length };
      };

      const displayedOrders = showAllOrders ? orders : orders.slice(0, 5);

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-yellow-50">
          {/* Header */}
          <div className="bg-gradient-to-r from-orange-500 to-yellow-500 text-white p-6 shadow-lg">
            <h1 className="text-3xl font-bold text-center">Juice Therapy</h1>
            <p className="text-center text-sm mt-1 opacity-90">Billing system for outdoor stall</p>
            <p className="text-center text-xs mt-3 opacity-75">developed by Biplab Bawali</p>
          </div>

          {/* Navigation */}
          <div className="bg-white shadow-md sticky top-0 z-10">
            <div className="flex overflow-x-auto">
              {[
                { id: 'new-sale', label: 'New Sale', icon: 'ShoppingCart' },
                { id: 'history', label: 'Order History', icon: 'FileText' },
                { id: 'summary', label: 'Summary', icon: 'BarChart3' },
                { id: 'items', label: 'Manage Items', icon: 'Package' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 flex items-center justify-center gap-2 py-4 px-3 border-b-2 transition-colors whitespace-nowrap ${
                    activeTab === tab.id
                      ? 'border-orange-500 text-orange-500 bg-orange-50'
                      : 'border-transparent text-gray-600'
                  }`}
                >
                  <Icon name={tab.icon} size={18} />
                  <span className="text-sm font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Content */}
          <div className="p-4 max-w-4xl mx-auto">
            {/* New Sale Tab */}
            {activeTab === 'new-sale' && (
              <div className="space-y-4">
                <div className="bg-white rounded-lg shadow-md p-4">
                  <h2 className="text-xl font-bold text-gray-800 mb-2">
                    Order #{getTodayOrderNumber()}
                  </h2>
                  <p className="text-sm text-gray-600">
                    {new Date().toLocaleDateString('en-IN', {
                      day: 'numeric',
                      month: 'long',
                      year: 'numeric'
                    })}
                  </p>
                </div>

                {items.length === 0 ? (
                  <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-center">
                    <p className="text-gray-700">Please add items first from "Manage Items" tab</p>
                  </div>
                ) : (
                  <>
                    <div className="bg-white rounded-lg shadow-md p-4">
                      <h3 className="font-semibold text-gray-800 mb-3">Select Items</h3>
                      <div className="grid grid-cols-2 gap-2">
                        {items.map(item => (
                          <button
                            key={item.id}
                            onClick={() => addToCurrentOrder(item.id)}
                            className="bg-orange-100 hover:bg-orange-200 p-3 rounded-lg text-left transition-colors"
                          >
                            <div className="font-medium text-gray-800">{item.name}</div>
                            <div className="text-sm text-orange-600">₹{item.price}</div>
                          </button>
                        ))}
                      </div>
                    </div>

                    {currentOrder.length > 0 && (
                      <div className="bg-white rounded-lg shadow-md p-4">
                        <h3 className="font-semibold text-gray-800 mb-3">Current Order</h3>
                        <div className="space-y-2">
                          {currentOrder.map(item => (
                            <div key={item.itemId} className="flex items-center justify-between bg-gray-50 p-3 rounded">
                              <div className="flex-1">
                                <div className="font-medium text-gray-800">{item.name}</div>
                                <div className="text-sm text-gray-600">₹{item.price} each</div>
                              </div>
                              <input
                                type="number"
                                value={item.quantity}
                                onChange={(e) => updateOrderQuantity(item.itemId, e.target.value)}
                                className="w-16 px-2 py-1 border rounded text-center mx-2"
                                min="0"
                              />
                              <div className="font-semibold text-orange-600 w-20 text-right">
                                ₹{(item.price * item.quantity).toFixed(2)}
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="mt-4 pt-4 border-t">
                          <div className="flex justify-between items-center text-xl font-bold">
                            <span>Total:</span>
                            <span className="text-orange-600">₹{calculateTotal(currentOrder).toFixed(2)}</span>
                          </div>
                        </div>
                        <div className="mt-4 space-y-2">
                          <button
                            onClick={() => saveOrder(true, true)}
                            className="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold transition-colors"
                          >
                            Save Order (Paid & Served)
                          </button>
                          <button
                            onClick={() => saveOrder(false, false)}
                            className="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-semibold transition-colors"
                          >
                            Save Order (Pending)
                          </button>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

            {/* Order History Tab */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-bold text-gray-800">Order History</h2>
                {orders.length === 0 ? (
                  <div className="bg-white rounded-lg shadow-md p-8 text-center text-gray-600">
                    No orders yet
                  </div>
                ) : (
                  <>
                    {displayedOrders.map(order => (
                      <div key={order.id} className="bg-white rounded-lg shadow-md p-4">
                        <div className="flex justify-between items-start mb-3">
                          <div>
                            <h3 className="text-lg font-bold text-gray-800">
                              Order #{order.orderNumber}
                            </h3>
                            <p className="text-sm text-gray-600">
                              {new Date(order.date).toLocaleString('en-IN')}
                            </p>
                          </div>
                          <button
                            onClick={() => deleteOrder(order.id)}
                            className="text-red-500 hover:text-red-700"
                          >
                            <Icon name="Trash2" />
                          </button>
                        </div>
                        <div className="space-y-1 mb-3">
                          {order.items.map((item, idx) => (
                            <div key={idx} className="flex justify-between text-sm">
                              <span className="text-gray-700">
                                {item.name} x {item.quantity}
                              </span>
                              <span className="text-gray-800">
                                ₹{(item.price * item.quantity).toFixed(2)}
                              </span>
                            </div>
                          ))}
                        </div>
                        <div className="border-t pt-3">
                          <div className="flex justify-between font-bold text-lg mb-3">
                            <span>Total:</span>
                            <span className="text-orange-600">₹{order.total.toFixed(2)}</span>
                          </div>
                          <div className="flex gap-4">
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input
                                type="checkbox"
                                checked={order.paid}
                                onChange={() => toggleOrderStatus(order.id, 'paid')}
                                className="w-5 h-5"
                              />
                              <span className="text-sm font-medium">Paid</span>
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer">
                              <input
                                type="checkbox"
                                checked={order.served}
                                onChange={() => toggleOrderStatus(order.id, 'served')}
                                className="w-5 h-5"
                              />
                              <span className="text-sm font-medium">Served</span>
                            </label>
                          </div>
                        </div>
                      </div>
                    ))}
                    {orders.length > 5 && (
                      <button
                        onClick={() => setShowAllOrders(!showAllOrders)}
                        className="w-full bg-gray-100 hover:bg-gray-200 py-3 rounded-lg font-medium text-gray-700 flex items-center justify-center gap-2 transition-colors"
                      >
                        {showAllOrders ? (
                          <>
                            <Icon name="ChevronUp" />
                            Show Less
                          </>
                        ) : (
                          <>
                            <Icon name="ChevronDown" />
                            Show More ({orders.length - 5} more)
                          </>
                        )}
                      </button>
                    )}
                  </>
                )}
              </div>
            )}

            {/* Summary Tab */}
            {activeTab === 'summary' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-bold text-gray-800">Sales Summary</h2>

                <div className="bg-white rounded-lg shadow-md p-4">
                  <h3 className="font-semibold text-gray-800 mb-3">Filter Period</h3>
                  <div className="grid grid-cols-2 gap-2 mb-3">
                    {['today', 'yesterday', 'last3days', 'custom'].map(filter => (
                      <button
                        key={filter}
                        onClick={() => setSummaryFilter(filter)}
                        className={`py-2 px-4 rounded-lg font-medium transition-colors ${
                          summaryFilter === filter
                            ? 'bg-orange-500 text-white'
                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }`}
                      >
                        {filter === 'today' && 'Today'}
                        {filter === 'yesterday' && 'Yesterday'}
                        {filter === 'last3days' && 'Last 3 Days'}
                        {filter === 'custom' && 'Custom Range'}
                      </button>
                    ))}
                  </div>

                  {summaryFilter === 'custom' && (
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="date"
                        value={customDateRange.start}
                        onChange={(e) => setCustomDateRange({...customDateRange, start: e.target.value})}
                        className="border rounded px-3 py-2"
                      />
                      <input
                        type="date"
                        value={customDateRange.end}
                        onChange={(e) => setCustomDateRange({...customDateRange, end: e.target.value})}
                        className="border rounded px-3 py-2"
                      />
                    </div>
                  )}
                </div>

                {(() => {
                  const { itemSales, totalRevenue, orderCount } = getSummaryData();
                  return (
                    <>
                      <div className="bg-gradient-to-r from-orange-500 to-yellow-500 text-white rounded-lg shadow-md p-6">
                        <div className="text-center">
                          <p className="text-sm opacity-90 mb-1">Total Revenue</p>
                          <p className="text-4xl font-bold">₹{totalRevenue.toFixed(2)}</p>
                          <p className="text-sm opacity-90 mt-2">{orderCount} orders</p>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow-md p-4">
                        <h3 className="font-semibold text-gray-800 mb-3">Item-wise Sales</h3>
                        {Object.keys(itemSales).length === 0 ? (
                          <p className="text-gray-600 text-center py-4">No sales data</p>
                        ) : (
                          <div className="space-y-2">
                            {Object.entries(itemSales).map(([name, data]) => (
                              <div key={name} className="bg-gray-50 p-3 rounded-lg">
                                <div className="flex justify-between items-center">
                                  <div>
                                    <div className="font-medium text-gray-800">{name}</div>
                                    <div className="text-sm text-gray-600">
                                      Quantity: {data.quantity}
                                    </div>
                                  </div>
                                  <div className="text-right">
                                    <div className="font-semibold text-orange-600">
                                      ₹{data.revenue.toFixed(2)}
                                    </div>
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </>
                  );
                })()}
              </div>
            )}

            {/* Manage Items Tab */}
            {activeTab === 'items' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold text-gray-800">Manage Items</h2>
                  <button
                    onClick={() => {
                      setShowItemForm(!showItemForm);
                      setEditingItem(null);
                      setItemForm({ name: '', price: '' });
                    }}
                    className="bg-orange-500 hover:bg-orange-600 text-white p-3 rounded-lg transition-colors"
                  >
                    <Icon name="Plus" />
                  </button>
                </div>

                {showItemForm && (
                  <div className="bg-white rounded-lg shadow-md p-4">
                    <h3 className="font-semibold text-gray-800 mb-3">
                      {editingItem ? 'Edit Item' : 'Add New Item'}
                    </h3>
                    <div className="space-y-3">
                      <input
                        type="text"
                        placeholder="Item Name"
                        value={itemForm.name}
                        onChange={(e) => setItemForm({...itemForm, name: e.target.value})}
                        className="w-full border rounded-lg px-4 py-2"
                      />
                      <input
                        type="number"
                        placeholder="Price"
                        value={itemForm.price}
                        onChange={(e) => setItemForm({...itemForm, price: e.target.value})}
                        className="w-full border rounded-lg px-4 py-2"
                        step="0.01"
                      />
                      <div className="flex gap-2">
                        <button
                          onClick={addItem}
                          className="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-semibold transition-colors"
                        >
                          {editingItem ? 'Update' : 'Add'}
                        </button>
                        <button
                          onClick={() => {
                            setShowItemForm(false);
                            setEditingItem(null);
                            setItemForm({ name: '', price: '' });
                          }}
                          className="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 rounded-lg font-semibold transition-colors"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {items.length === 0 ? (
                  <div className="bg-white rounded-lg shadow-md p-8 text-center text-gray-600">
                    No items added yet
                  </div>
                ) : (
                  <div className="space-y-2">
                    {items.map(item => (
                      <div key={item.id} className="bg-white rounded-lg shadow-md p-4 flex justify-between items-center">
                        <div>
                          <div className="font-semibold text-gray-800">{item.name}</div>
                          <div className="text-orange-600">₹{item.price}</div>
                        </div>
                        <div className="flex gap-2">
                          <button
                            onClick={() => editItem(item)}
                            className="text-blue-500 hover:text-blue-700 p-2"
                          >
                            <Icon name="Edit2" />
                          </button>
                          <button
                            onClick={() => deleteItem(item.id)}
                            className="text-red-500 hover:text-red-700 p-2"
                          >
                            <Icon name="Trash2" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<JuiceTherapyBilling />);
  </script>

  <!-- Inline Service Worker registration (keeps PWA offline-capable) -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'juice-therapy-cache-v1';
        const urlsToCache = ['./', location.href];

        self.addEventListener('install', event => {
          event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)));
          self.skipWaiting();
        });

        self.addEventListener('activate', event => {
          event.waitUntil(self.clients.claim());
        });

        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request).then(response => {
              return response || fetch(event.request);
            })
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).then(reg => {
        // registered
      }).catch(err => {
        console.warn('SW registration failed', err);
      });
    }
  </script>
</body>
</html>
